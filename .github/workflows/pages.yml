name: Pages

on:
  push:
    branches: [main]
  # So the site can be republished without an empty commit, which is what you
  # want the first time something is wrong with the deploy rather than with the
  # code.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight. A superseded build is
# wasted minutes; a cancelled deploy can leave the published site in a state
# that matches no commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck and lint before publishing rather than after. This is the
      # only workflow whose output is visible to the public, so the bar for
      # what it will push is higher than for a pull request check.
      - run: pnpm typecheck
      - run: pnpm lint

      # No NEXT_PUBLIC_BASE_PATH. The site is served from the root of
      # riggit.verastack.dev rather than from a project path, so the variable
      # stays empty and every internal link resolves where it is written.
      # Setting it again would prefix every asset with a directory that does
      # not exist.
      - name: Build
        run: pnpm build

      # Stops Pages running the output through Jekyll, which would drop every
      # path beginning with an underscore. Next puts its entire static bundle
      # under `_next`, so without this the site publishes with no CSS and no
      # JavaScript and looks broken rather than absent.
      - name: Disable Jekyll processing
        run: touch .next-build/.nojekyll

      - uses: actions/configure-pages@v6

      # `.next-build`, not `out`. Setting `distDir` makes the static export
      # land in that directory itself, and there is no `out` to find.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .next-build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
